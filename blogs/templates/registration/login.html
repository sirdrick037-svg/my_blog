{% extends 'base.html' %}

{% block title %}Login{% endblock %}

{% block content %}
<div class="max-w-md mx-auto mt-12 p-8 bg-white border border-gray-200 rounded-lg shadow-sm">
    <h1 class="text-2xl font-bold mb-6">Log in</h1>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="mt-4 w-full bg-gray-900 text-white px-4 py-2 rounded-lg hover:bg-gray-700">
            Log in
        </button>
    </form>
</div>
{% endblock %}
