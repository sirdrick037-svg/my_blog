{% extends "base.html" %}

{% block title %}Password updated | DevBlogs{% endblock %}

{% block content %}
<section class="mx-auto max-w-xl px-6 py-16">
    <div class="rounded-2xl bg-white p-8 text-center shadow-lg">
        <h1 class="text-3xl font-bold text-slate-900">
            Password updated
        </h1>

        <p class="mt-4 text-slate-600">
            Your password has been changed successfully.
        </p>

        <a href="{% url 'login' %}"
           class="mt-6 inline-block rounded-lg bg-indigo-600 px-5 py-3
                  font-semibold text-white hover:bg-indigo-700">
            Sign in
        </a>
    </div>
</section>
{% endblock %}
