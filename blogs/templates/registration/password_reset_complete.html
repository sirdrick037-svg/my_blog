{% extends "base.html" %}

{% block content %}

<div class="min-h-screen flex items-center justify-center bg-gray-100">
  <div class="max-w-md w-full bg-white p-6 rounded-lg shadow-lg text-center">


<div class="mb-6">
  <div class="mx-auto flex items-center justify-center h-12 w-12 rounded-full bg-green-100">
    <svg
      class="h-6 w-6 text-green-600"
      fill="none"
      stroke="currentColor"
      viewBox="0 0 24 24"
      xmlns="http://www.w3.org/2000/svg"
    >
      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        stroke-width="2"
        d="M5 13l4 4L19 7"
      ></path>
    </svg>
  </div>
</div>

<h1 class="text-2xl font-bold text-gray-800 mb-2">
  Password reset complete
</h1>

<p class="text-sm text-gray-600 mb-6">
  Your password has been successfully changed.
  You can now log in using your new password.
</p>

<a
  href="{% url 'login' %}"
  class="block w-full bg-indigo-600 text-white py-2 px-4 rounded-md hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-opacity-50"
>
  Log in
</a>


  </div>
</div>
{% endblock %}
