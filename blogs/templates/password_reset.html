{% extends "base.html" %}

{% block title %}Reset password | DevBlogs{% endblock %}

{% block content %}
<section class="mx-auto max-w-xl px-6 py-16">
    <div class="rounded-2xl bg-white p-8 shadow-lg">
        <h1 class="text-3xl font-bold text-slate-900">
            Forgot your password?
        </h1>

        <p class="mt-3 text-slate-600">
            Enter your account email address to request a password reset.
        </p>

        <form method="post" class="mt-8 space-y-5">
            {% csrf_token %}

            <div>
                <label for="id_email"
                       class="mb-2 block font-semibold text-slate-700">
                    Email address
                </label>

                <input
                    type="email"
                    name="email"
                    id="id_email"
                    required
                    autocomplete="email"
                    class="w-full rounded-lg border border-slate-300 px-4 py-3
                           focus:border-indigo-500 focus:outline-none"
                >
            </div>

            <button
                type="submit"
                class="w-full rounded-lg bg-indigo-600 px-5 py-3
                       font-semibold text-white hover:bg-indigo-700"
            >
                Send reset link
            </button>
        </form>
    </div>
</section>
{% endblock %}
