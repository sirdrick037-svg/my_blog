{% extends "base.html" %}

{% block title %}Check your email | DevBlogs{% endblock %}

{% block content %}
<section class="mx-auto max-w-xl px-6 py-16">
    <div class="rounded-2xl bg-white p-8 text-center shadow-lg">
        <h1 class="text-3xl font-bold text-slate-900">
            Check your email
        </h1>

        <p class="mt-4 leading-7 text-slate-600">
            If an eligible account exists for that address, a password
            reset link will be sent.
        </p>

        <a href="{% url 'login' %}"
           class="mt-6 inline-block font-semibold text-indigo-600">
            Return to login
        </a>
    </div>
</section>
{% endblock %}
